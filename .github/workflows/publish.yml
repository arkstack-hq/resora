name: Publish to NPM

on:
  push:
    tags:
      - 'v*'
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      package:
        description: 'Package to publish'
        required: true
        type: choice
        default: resora
        options:
          - resora
          - plugin-clear-router
      version:
        description: 'Version to publish (optional)'
        required: false
        default: ''

jobs:
  publish:
    name: Publish to NPM
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22.x
          cache: 'pnpm'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Resolve package
        id: pkg
        run: |
          case "${{ github.event.inputs.package || 'resora' }}" in
            plugin-clear-router)
              echo "dir=packages/plugin-clear-router" >> $GITHUB_OUTPUT
              echo "name=@resora/plugin-clear-router" >> $GITHUB_OUTPUT
              ;;
            *)
              echo "dir=." >> $GITHUB_OUTPUT
              echo "name=resora" >> $GITHUB_OUTPUT
              ;;
          esac

      - name: Configure Git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Check and bump version if needed
        id: version_check
        if: ${{ github.event.inputs.version == '' }}
        working-directory: ${{ steps.pkg.outputs.dir }}
        run: |
          # Get current version from package.json
          CURRENT_VERSION=$(node -p "require('./package.json').version")
          echo "Current package.json version: $CURRENT_VERSION"

          # Get published version from npm (suppress errors if package doesn't exist)
          PUBLISHED_VERSION=$(pnpm view ${{ steps.pkg.outputs.name }} version 2>/dev/null || echo "0.0.0")
          echo "Published npm version: $PUBLISHED_VERSION"

          # Function to compare versions
          compare_versions() {
            if [ "$1" = "$2" ]; then
              echo "equal"
            else
              # Use sort -V for version comparison
              SORTED=$(printf "%s\n%s" "$1" "$2" | sort -V | head -n1)
              if [ "$SORTED" = "$1" ]; then
                echo "less"
              else
                echo "greater"
              fi
            fi
          }

          COMPARISON=$(compare_versions "$CURRENT_VERSION" "$PUBLISHED_VERSION")
          echo "Version comparison: $COMPARISON"

          if [ "$COMPARISON" = "equal" ] || [ "$COMPARISON" = "less" ]; then
            echo "Version conflict detected. Auto-bumping version..."
            
            # Parse version components
            IFS='.' read -r MAJOR MINOR PATCH <<< "$PUBLISHED_VERSION"
            
            # Bump patch version
            NEW_PATCH=$((PATCH + 1))
            NEW_VERSION="${MAJOR}.${MINOR}.${NEW_PATCH}"
            
            echo "New version: $NEW_VERSION"
            
            # Update package.json
            pnpm version "$NEW_VERSION" --no-git-tag-version
            
            echo "version_bumped=true" >> $GITHUB_OUTPUT
            echo "new_version=$NEW_VERSION" >> $GITHUB_OUTPUT
          else
            echo "Version is valid. Proceeding with current version."
            echo "version_bumped=false" >> $GITHUB_OUTPUT
            echo "new_version=$CURRENT_VERSION" >> $GITHUB_OUTPUT
          fi

      - name: Commit and push version bump
        if: steps.version_check.outputs.version_bumped == 'true'
        working-directory: ${{ steps.pkg.outputs.dir }}
        run: |
          git add package.json
          git commit -m "chore: bump ${{ steps.pkg.outputs.name }} to ${{ steps.version_check.outputs.new_version }} [skip ci]"
          git push origin HEAD:main

      - name: Set version from input
        if: ${{ github.event.inputs.version != '' }}
        working-directory: ${{ steps.pkg.outputs.dir }}
        run: |
          echo "Setting version to ${{ github.event.inputs.version }}"
          pnpm version "${{ github.event.inputs.version }}" --no-git-tag-version
          echo "version_bumped=true" >> $GITHUB_OUTPUT
          echo "new_version=${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT
          git add package.json
          git commit -m "chore: set ${{ steps.pkg.outputs.name }} version to ${{ github.event.inputs.version }} [skip ci]"
          git push origin HEAD:main

      # Plugins resolve resora from the workspace, so it has to be built first.
      - name: Build resora
        if: steps.pkg.outputs.dir != '.'
        run: pnpm build

      - name: Run linter
        working-directory: ${{ steps.pkg.outputs.dir }}
        run: pnpm lint

      - name: Run tests
        working-directory: ${{ steps.pkg.outputs.dir }}
        run: pnpm test

      - name: Build project
        working-directory: ${{ steps.pkg.outputs.dir }}
        run: pnpm build

      - name: Publish to NPM
        working-directory: ${{ steps.pkg.outputs.dir }}
        run: pnpm publish --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Create release notes
        if: steps.version_check.outputs.version_bumped == 'true'
        run: |
          echo "Published ${{ steps.pkg.outputs.name }} ${{ steps.version_check.outputs.new_version }} to npm" >> $GITHUB_STEP_SUMMARY
          echo "Auto-bumped from published version" >> $GITHUB_STEP_SUMMARY
