name: Publish to NPM

on:
  push:
    tags:
      - 'v*'
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      package:
        description: 'Package to publish'
        required: true
        type: choice
        default: resora
        options:
          - resora
          - plugin-clear-router
      version:
        description: 'Version to publish (optional)'
        required: false
        default: ''

jobs:
  publish:
    name: Publish to NPM
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22.x
          cache: 'pnpm'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Resolve package
        id: pkg
        run: |
          case "${{ github.event.inputs.package || 'resora' }}" in
            plugin-clear-router)
              echo "dir=packages/plugin-clear-router" >> $GITHUB_OUTPUT
              echo "name=@resora/plugin-clear-router" >> $GITHUB_OUTPUT
              ;;
            *)
              echo "dir=." >> $GITHUB_OUTPUT
              echo "name=resora" >> $GITHUB_OUTPUT
              ;;
          esac

      - name: Configure Git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Resolve version
        id: version
        working-directory: ${{ steps.pkg.outputs.dir }}
        env:
          INPUT_VERSION: ${{ github.event.inputs.version }}
          RELEASE_TAG: ${{ github.event.release.tag_name || (github.ref_type == 'tag' && github.ref_name) || '' }}
        run: |
          CURRENT_VERSION=$(node -p "require('./package.json').version")
          PUBLISHED_VERSION=$(pnpm view ${{ steps.pkg.outputs.name }} version 2>/dev/null || echo "0.0.0")
          echo "package.json version: $CURRENT_VERSION"
          echo "Published npm version: $PUBLISHED_VERSION"

          if [ -n "$INPUT_VERSION" ]; then
            VERSION="${INPUT_VERSION#v}"
            SOURCE="input"
          elif [ -n "$RELEASE_TAG" ]; then
            VERSION="${RELEASE_TAG#v}"
            SOURCE="release tag $RELEASE_TAG"
          else
            LATEST=$(printf "%s\n%s" "$CURRENT_VERSION" "$PUBLISHED_VERSION" | sort -V | tail -n1)

            if [ "$LATEST" = "$PUBLISHED_VERSION" ]; then
              IFS='.' read -r MAJOR MINOR PATCH <<< "$PUBLISHED_VERSION"
              VERSION="${MAJOR}.${MINOR}.$((PATCH + 1))"
              SOURCE="patch bump from npm"
            else
              VERSION="$CURRENT_VERSION"
              SOURCE="package.json"
            fi
          fi

          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::'$VERSION' is not a valid semver version"
            exit 1
          fi

          if [ "$VERSION" = "$PUBLISHED_VERSION" ] || pnpm view "${{ steps.pkg.outputs.name }}@$VERSION" version 2>/dev/null | grep -q .; then
            echo "::error::${{ steps.pkg.outputs.name }}@$VERSION is already on npm"
            exit 1
          fi

          echo "Publishing $VERSION (from $SOURCE)"
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "source=$SOURCE" >> $GITHUB_OUTPUT

          if [ "$VERSION" != "$CURRENT_VERSION" ]; then
            pnpm version "$VERSION" --no-git-tag-version
            echo "changed=true" >> $GITHUB_OUTPUT
          fi

      # Plugins resolve resora from the workspace, so it has to be built first.
      - name: Build resora
        if: steps.pkg.outputs.dir != '.'
        run: pnpm build

      - name: Run linter
        working-directory: ${{ steps.pkg.outputs.dir }}
        run: pnpm lint

      - name: Run tests
        working-directory: ${{ steps.pkg.outputs.dir }}
        run: pnpm test

      - name: Build project
        working-directory: ${{ steps.pkg.outputs.dir }}
        run: pnpm build

      - name: Publish to NPM
        working-directory: ${{ steps.pkg.outputs.dir }}
        run: pnpm publish --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Sync version to main
        if: steps.version.outputs.changed == 'true'
        run: |
          git fetch origin main
          git checkout -B main origin/main

          cd "${{ steps.pkg.outputs.dir }}"
          pnpm version "${{ steps.version.outputs.version }}" --no-git-tag-version --allow-same-version

          if git diff --quiet -- package.json; then
            exit 0
          fi

          git add package.json
          git commit -m "chore: bump ${{ steps.pkg.outputs.name }} to ${{ steps.version.outputs.version }} [skip ci]"
          git push origin main

      - name: Summary
        run: echo "Published ${{ steps.pkg.outputs.name }}@${{ steps.version.outputs.version }} to npm (from ${{ steps.version.outputs.source }})" >> $GITHUB_STEP_SUMMARY
